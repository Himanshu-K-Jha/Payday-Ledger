<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payday Ledger</title>
<meta name="theme-color" content="#16283D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316283D'/%3E%3Cpath d='M25 40h50a6 6 0 016 6v20a6 6 0 01-6 6H25a6 6 0 01-6-6V46a6 6 0 016-6z' fill='none' stroke='%23E8C766' stroke-width='5'/%3E%3Ccircle cx='68' cy='56' r='4' fill='%23E8C766'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root{
    --ink:#16283D; --ink2:#1F3550; --ink3:#2B3A4A;
    --gold:#E8C766; --gold-dim:#D9B65B;
    --paper:#F4EFE4; --card:#FFFFFF; --line:#EAE2CF;
    --green:#3F7A5B; --green-bg:#E8F2EC;
    --red:#B54834; --red-bg:#FBE9E4;
    --blue:#3E6FA6; --blue-bg:#EAF1F9;
    --muted:#8A8370; --muted2:#B9C2CE;
    --shadow-sm:0 1px 2px rgba(22,40,61,0.06), 0 1px 1px rgba(22,40,61,0.04);
    --shadow-md:0 4px 14px rgba(22,40,61,0.08), 0 2px 4px rgba(22,40,61,0.05);
    --shadow-lg:0 20px 50px rgba(22,40,61,0.18);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);font-family:'Inter',ui-sans-serif,system-ui;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .disp{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  button{cursor:pointer;font-family:inherit;border:none;background:none;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{height:0;width:0;}
  .hidden{display:none !important;}
  .scrollx{display:flex;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .scrollx::-webkit-scrollbar{display:none;}

  /* ================= LOGIN ================= */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 20% -10%, #24405f 0%, var(--ink) 55%);padding:20px;}
  .login-card{width:380px;max-width:100%;background:var(--card);border-radius:20px;padding:38px 32px;box-shadow:var(--shadow-lg);}
  .login-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(155deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 20px rgba(232,199,102,0.35);}
  .login-card h1{text-align:center;font-size:23px;margin:0 0 4px;}
  .login-card p.sub{text-align:center;font-size:13px;color:var(--muted);margin:0 0 26px;}
  .login-card input{width:100%;font-size:14px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--line);outline:none;margin-bottom:12px;transition:border-color .15s;}
  .login-card input:focus{border-color:var(--gold);}
  .login-btn{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:700;background:linear-gradient(155deg,var(--gold),var(--gold-dim));color:var(--ink);margin-top:4px;box-shadow:0 6px 16px rgba(232,199,102,0.35);transition:transform .1s;}
  .login-btn:active{transform:scale(0.98);}
  .login-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:18px;}
  .login-switch a{color:var(--blue);cursor:pointer;font-weight:700;}
  .login-error{font-size:12px;color:var(--red);text-align:center;margin-bottom:10px;min-height:16px;}
  .login-forgot{text-align:right;font-size:12px;color:var(--blue);cursor:pointer;margin:-6px 0 14px;font-weight:600;}

  /* ================= APP SHELL ================= */
  #appScreen{display:none;}
  .hero{background:radial-gradient(900px 400px at 15% -20%, #2c4a6d 0%, var(--ink) 60%);padding:20px 28px 26px;}
  .hero-top{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto 18px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,var(--gold),var(--gold-dim));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand h1{color:#fff;font-size:18px;margin:0;letter-spacing:-0.01em;}
  .user-chip{display:flex;align-items:center;gap:10px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.14);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  #userEmailLabel{color:var(--muted2);font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .signout-btn{background:rgba(255,255,255,0.1);color:#fff;padding:7px 13px;border-radius:8px;font-size:11.5px;font-weight:600;}
  .signout-btn:hover{background:rgba(255,255,255,0.18);}

  .pillrow{gap:6px;padding-bottom:14px;max-width:1180px;margin:0 auto;}
  .ypill{flex-shrink:0;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,0.08);color:#fff;scroll-snap-align:start;transition:background .12s;}
  .ypill.active{background:var(--gold);color:var(--ink);}
  .mpill{flex-shrink:0;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;background:transparent;color:var(--muted2);border:1px solid rgba(255,255,255,0.14);scroll-snap-align:start;}
  .mpill.active{background:rgba(232,199,102,0.2);color:var(--gold);border-color:var(--gold);}
  .month-pillrow{max-width:1180px;margin:0 auto;padding-bottom:2px;}

  .hero-balance{max-width:1180px;margin:6px auto 0;}
  .hero-balance-label{color:var(--muted2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .hero-balance-val{color:#fff;font-size:44px;font-weight:800;line-height:1.1;margin:4px 0 16px;letter-spacing:-0.02em;}
  .hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .hero-stat{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:11px 13px;}
  .hero-stat-icon{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .hero-stat-label{color:var(--muted2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .hero-stat-val{color:#fff;font-size:16px;font-weight:700;margin-top:2px;}

  .content{max-width:1180px;margin:0 auto;padding:24px 28px 100px;}
  .period-label{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:14px;}
  .period-label b{color:var(--ink);}

  .secondary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
  .sec-card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--line);}
  .sec-label{font-size:10px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .sec-val{font-size:18px;font-weight:700;}
  .sec-bar-wrap{display:flex;align-items:center;gap:10px;}
  .sec-bar-bg{flex:1;height:6px;border-radius:999px;background:var(--paper);overflow:hidden;}
  .sec-bar-fill{height:100%;border-radius:999px;}

  .panel{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);border:1px solid var(--line);margin-bottom:24px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .section-title{font-size:16px;font-weight:700;}
  .tabbar{display:flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px;}
  .tabbtn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);}
  .tabbtn.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm);}
  .cat-row{margin-bottom:13px;}
  .cat-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .cat-top .name{display:flex;align-items:center;gap:7px;}
  .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cat-bar-bg{height:7px;border-radius:999px;background:var(--paper);overflow:hidden;display:flex;}
  .empty-mini{font-size:12.5px;color:var(--muted);padding:20px 0;text-align:center;}

  /* ---------- Goals ---------- */
  .goals-scroll{gap:14px;padding-bottom:6px;margin:0 -2px;}
  .goal-card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--line);flex:0 0 250px;scroll-snap-align:start;}
  .goal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
  .goal-name{font-size:14.5px;font-weight:700;}
  .goal-badge{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:3px 8px;border-radius:999px;background:var(--paper);color:var(--muted);white-space:nowrap;}
  .goal-amounts{font-size:12px;color:var(--muted);margin-bottom:9px;}
  .goal-amounts b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .goal-bar-bg{height:8px;border-radius:999px;background:var(--paper);overflow:hidden;margin-bottom:11px;}
  .goal-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .3s;}
  .goal-req{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  .goal-pace{display:inline-block;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .pace-ontrack{background:var(--green-bg);color:var(--green);}
  .pace-behind{background:var(--red-bg);color:var(--red);}
  .pace-new{background:var(--paper);color:var(--muted);}
  .goal-actions{margin-top:12px;display:flex;gap:6px;}
  .goal-actions button{font-size:11px;font-weight:600;padding:6px 10px;border-radius:7px;border:1px solid var(--line);color:var(--muted);}
  .goal-actions button:hover{background:var(--paper);color:var(--ink);}
  .addgoal-card{flex:0 0 180px;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;scroll-snap-align:start;}
  .addgoal-card:hover{border-color:var(--gold);color:var(--ink);background:#FFFCF3;}
  .addgoal-plus{width:34px;height:34px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;}

  /* ---------- Entries ---------- */
  .entries-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .addbtn{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:10px;background:var(--ink);color:#fff;box-shadow:var(--shadow-sm);}
  .addbtn:hover{background:var(--ink2);}
  .group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 9px;}
  .group-label:first-child{margin-top:0;}
  .entry-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:8px;transition:box-shadow .12s;}
  .entry-row:hover{box-shadow:var(--shadow-sm);}
  .entry-row.income{background:var(--green-bg);border-color:#D3E4DA;}
  .entry-row.investment{background:var(--blue-bg);border-color:#D4E0EC;}
  .entry-main{display:flex;align-items:center;gap:11px;flex:1 1 200px;min-width:0;}
  .entry-side{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;}
  .entry-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10.5px;font-weight:800;font-family:'IBM Plex Mono',monospace;}
  .entry-body{flex:1;min-width:0;}
  .entry-title{font-size:13.5px;font-weight:600;}
  .entry-note{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .goal-chip{display:inline-block;font-size:9.5px;font-weight:700;background:#fff;color:var(--blue);padding:2px 8px;border-radius:999px;margin-left:6px;}
  .entry-amt{font-size:14px;font-weight:800;flex-shrink:0;min-width:88px;text-align:right;}
  .status-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0;}
  .status-btn.paid{background:var(--green);}
  .status-btn.pending{background:var(--red);}
  .iconbtn{flex-shrink:0;padding:6px;color:#b3a892;border-radius:8px;}
  .iconbtn:hover{color:var(--ink);background:var(--paper);}
  .empty{text-align:center;font-size:13.5px;color:var(--muted);padding:50px 0;}

  /* ---------- Floating action button ---------- */
  .fab{position:fixed;bottom:26px;right:26px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(155deg,var(--gold),var(--gold-dim));box-shadow:0 10px 26px rgba(232,199,102,0.45);
    display:flex;align-items:center;justify-content:center;z-index:40;transition:transform .12s;}
  .fab:hover{transform:scale(1.06);}
  .fab:active{transform:scale(0.95);}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,25,38,0.55);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal-content{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;padding:22px 22px 26px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .22s ease;}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-overlay{animation:fadeIn .15s ease;}
  .modal-handle{width:36px;height:4px;background:var(--line);border-radius:999px;margin:0 auto 16px;}
  .form-heading{font-size:15px;font-weight:700;margin-bottom:14px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .toggle-row{display:flex;gap:8px;margin-bottom:12px;}
  .toggle-btn{flex:1;padding:10px;border-radius:9px;font-size:12.5px;font-weight:700;background:var(--paper);color:var(--ink);}
  .toggle-btn.active-expense{background:var(--ink);color:#fff;}
  .toggle-btn.active-income{background:var(--green);color:#fff;}
  .toggle-btn.active-investment{background:var(--blue);color:#fff;}
  .toggle-btn.active-pending{background:var(--red);color:#fff;}
  .toggle-btn.active-paid{background:var(--green);color:#fff;}
  select,input[type=text],input[type=number],input[type=date]{width:100%;font-size:13.5px;border-radius:9px;padding:10px 13px;border:1.5px solid var(--line);outline:none;color:var(--ink);transition:border-color .15s;}
  select:focus,input:focus{border-color:var(--gold);}
  .submitbtn{padding:12px 22px;border-radius:9px;font-size:13.5px;font-weight:700;background:linear-gradient(155deg,var(--gold),var(--gold-dim));color:var(--ink);}
  .cancelbtn{padding:12px 22px;border-radius:9px;font-size:13.5px;font-weight:700;background:var(--paper);color:var(--ink);}
  .live-req{font-size:12.5px;color:var(--blue);font-weight:700;margin:-2px 0 12px;background:var(--blue-bg);padding:8px 12px;border-radius:9px;}

  @media (min-width: 720px){
    .modal-overlay{align-items:center;}
    .modal-content{border-radius:20px;}
    .modal-handle{display:none;}
  }

  @media (max-width: 900px){
    .secondary-grid{grid-template-columns:repeat(2,1fr);}
    .hero-stats{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
  }
  @media (max-width: 640px){
    .hero{padding:16px 16px 22px;}
    .hero-balance-val{font-size:34px;}
    .brand h1{font-size:16px;}
    .content{padding:18px 14px 100px;}
    .panel{padding:16px;}
    .secondary-grid{grid-template-columns:1fr 1fr;gap:10px;}
    .sec-val{font-size:16px;}
    .toggle-row{flex-wrap:wrap;}
    .entry-side{width:100%;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
    .entry-amt{min-width:auto;}
    .fab{bottom:20px;right:20px;width:52px;height:52px;}
    .login-card{padding:30px 24px;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16283D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/><path d="M4 7V5a2 2 0 0 1 2-2h9"/><circle cx="16" cy="12" r="1.2" fill="#16283D" stroke="none"/></svg>
    </div>
    <h1 class="disp" id="loginTitle">Welcome back</h1>
    <p class="sub" id="loginSub">Sign in to your Payday Ledger</p>
    <div class="login-error" id="loginError"></div>
    <input type="text" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <div class="login-forgot" id="forgotLink" onclick="handleForgotPassword()">Forgot password?</div>
    <button class="login-btn" id="loginSubmitBtn" onclick="handleAuthSubmit()">Sign In</button>
    <div class="login-switch" id="loginSwitch">Don't have an account? <a onclick="toggleAuthMode()">Create one</a></div>
  </div>
</div>

<div id="appScreen">
  <div class="hero">
    <div class="hero-top">
      <div class="brand">
        <div class="brand-logo">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16283D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Z"/><path d="M4 7V5a2 2 0 0 1 2-2h9"/><circle cx="16" cy="12" r="1.2" fill="#16283D" stroke="none"/></svg>
        </div>
        <h1 class="disp">Payday Ledger</h1>
      </div>
      <div class="user-chip">
        <div class="avatar" id="userAvatar"></div>
        <span id="userEmailLabel"></span>
        <button class="signout-btn" onclick="handleSignOut()">Sign out</button>
      </div>
    </div>

    <div class="scrollx pillrow" id="yearRow"></div>
    <div class="scrollx pillrow month-pillrow" id="monthRow"></div>

    <div class="hero-balance">
      <div class="hero-balance-label" id="heroLabel">Cash left right now</div>
      <div class="hero-balance-val mono" id="kCashLeft">₹0</div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-icon" style="background:rgba(63,122,91,0.2)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7FD9A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <div class="hero-stat-label">Salary</div>
          <div class="hero-stat-val mono" id="kSalary">₹0</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-icon" style="background:rgba(63,122,91,0.2)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7FD9A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </div>
          <div class="hero-stat-label">Paid</div>
          <div class="hero-stat-val mono" id="kPaid">₹0</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-icon" style="background:rgba(181,72,52,0.25)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F2A895" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          </div>
          <div class="hero-stat-label">Still due</div>
          <div class="hero-stat-val mono" id="kDue">₹0</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-icon" style="background:rgba(62,111,166,0.25)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9DC1EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>
          </div>
          <div class="hero-stat-label">Invested</div>
          <div class="hero-stat-val mono" id="kInvested">₹0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="period-label">Showing: <b id="periodLabel"></b></div>

    <div class="secondary-grid">
      <div class="sec-card">
        <div class="sec-label">Total planned</div>
        <div class="sec-val mono" id="kPlanned">₹0</div>
      </div>
      <div class="sec-card">
        <div class="sec-label">Projected left at period end</div>
        <div class="sec-val mono" id="kProjLeft">₹0</div>
      </div>
      <div class="sec-card">
        <div class="sec-label">Pending payments</div>

// ================= AUTH =================
function toggleAuthMode(){

async function handleAuthSubmit(){

  try{
    if(authMode === "signin"){
      await signInWithEmailAndPassword(auth, email, password);
    } else {

  }catch(e){
    errEl.textContent = friendlyAuthError(e.code);

}
window.handleAuthSubmit = handleAuthSubmit;

async function handleForgotPassword(){

  const errEl = document.getElementById("loginError");
  if(!email){ errEl.style.color="var(--red)"; errEl.textContent = "Enter your email above first, then tap 'Forgot password?'"; return; }

    document.getElementById("appScreen").style.display = "block";

function subscribeToData(userId){
  const entriesQ = query(collection(db, "users", userId, "entries"));
  unsubEntries = onSnapshot(entriesQ, (snap)=>{
    entries = snap.docs.map(d=>({id:d.id, ...d.data()}));

  }, (err)=>{ console.error("entries sync error", err); });

  const goalsQ = query(collection(db, "users", userId, "goals"));

// ================= YEAR / MONTH PICKER =================
function getYears(){
  const s = new Set();
  const start = now.getFullYear()-1;
  const end = 2040;
  for(let y=start;y<=end;y++) s.add(y);
  entries.forEach(t=>s.add(t.year));
  return Array.from(s).sort((a,b)=>a-b);
}
function periodLabel(){

function getFiltered(){

  });

// ================= KPIs =================
function computeKpi(filtered){
  const income = filtered.filter(t=>t.type==="income");
  const expense = filtered.filter(t=>t.type==="expense");
  const investment = filtered.filter(t=>t.type==="investment");
  const salary = income.reduce((s,t)=>s+t.amount,0);
  const planned = expense.reduce((s,t)=>s+t.amount,0);
  const paid = expense.filter(t=>t.status==="paid").reduce((s,t)=>s+t.amount,0);
  const due = expense.filter(t=>t.status==="pending").reduce((s,t)=>s+t.amount,0);
  const invested = investment.filter(t=>t.status==="paid").reduce((s,t)=>s+t.amount,0);
  const investedPlanned = investment.reduce((s,t)=>s+t.amount,0);
  const pendingCount = expense.filter(t=>t.status==="pending").length;
  return {
    salary, planned, paid, due, invested, pendingCount,
    cashLeft: salary - (paid + invested),
    projectedLeft: salary - (planned + investedPlanned),
    pctPaid: planned>0 ? paid/planned : 0,
  };
}
function renderKpis(k){
  document.getElementById("kSalary").textContent = "\u20B9"+fmt(k.salary);
  document.getElementById("kPlanned").textContent = "\u20B9"+fmt(k.planned);
  document.getElementById("kPaid").textContent = "\u20B9"+fmt(k.paid);
  document.getElementById("kDue").textContent = "\u20B9"+fmt(k.due);
  document.getElementById("kInvested").textContent = "\u20B9"+fmt(k.invested);
  const cl = document.getElementById("kCashLeft");
  cl.textContent = "\u20B9"+fmt(k.cashLeft); cl.style.color = k.cashLeft<0?"#F2A895":"#fff";
  const pl = document.getElementById("kProjLeft");
  pl.textContent = "\u20B9"+fmt(k.projectedLeft); pl.style.color = k.projectedLeft<0?"var(--red)":"var(--ink)";
  document.getElementById("kPending").textContent = k.pendingCount;
  document.getElementById("kPct").textContent = Math.round(k.pctPaid*100)+"%";
  document.getElementById("pctBar").style.width = Math.min(100,k.pctPaid*100)+"%";
  document.getElementById("pctBar").style.background = k.pctPaid>=1?"var(--green)":"var(--gold)";
}

// ================= BREAKDOWNS =================
function setBreakdownTab(tab){
  breakdownTab = tab;
  document.getElementById("tabExpenseBtn").classList.toggle("active", tab==="expense");
  document.getElementById("tabInvestmentBtn").classList.toggle("active", tab==="investment");
  document.getElementById("expenseBreakdown").classList.toggle("hidden", tab!=="expense");
  document.getElementById("investmentBreakdown").classList.toggle("hidden", tab!=="investment");
}
window.setBreakdownTab = setBreakdownTab;

function renderBreakdown(filtered, type, elId){
  const map = {};
  filtered.filter(t=>t.type===type).forEach(t=>{
    if(!map[t.category]) map[t.category]={paid:0,pending:0};
    map[t.category][t.status==="paid"?"paid":"pending"] += t.amount;
  });
  const rows = Object.entries(map).map(([cat,v])=>({cat,...v,total:v.paid+v.pending})).sort((a,b)=>b.total-a.total);
  const el = document.getElementById(elId);
  if(rows.length===0){ el.innerHTML = '<div class="empty-mini">Nothing logged for this period yet.</div>'; return; }
  const maxTotal = rows[0].total;
  const catMeta = CAT_MAPS[type];
  el.innerHTML = rows.map(r=>{
    const paidW = maxTotal? (r.paid/maxTotal*100):0;
    const pendW = maxTotal? (r.pending/maxTotal*100):0;
    const color = (catMeta[r.cat]||{}).color || "#999";
    return '<div class="cat-row"><div class="cat-top"><span class="name"><span class="cat-dot" style="background:'+color+'"></span>'+escapeHtml(r.cat)+'</span><span class="mono" style="font-weight:700">\u20B9'+fmt(r.total)+'</span></div>'+
      '<div class="cat-bar-bg"><div style="width:'+paidW+'%;background:var(--green)"></div><div style="width:'+pendW+'%;background:var(--red)"></div></div></div>';
  }).join("");
}

// ================= GOALS =================
function monthsBetween(targetDateStr){
  if(!targetDateStr) return 1;
  const target = new Date(targetDateStr+"T00:00:00");
  let months = (target.getFullYear()-now.getFullYear())*12 + (target.getMonth()-now.getMonth());
  return Math.max(1, months);
}
function goalSaved(goal){
  const contributed = entries.filter(t=>t.type==="investment" && t.status==="paid" && t.goalId===goal.id).reduce((s,t)=>s+t.amount,0);
  return (Number(goal.startingSaved)||0) + contributed;
}
function classifyGoal(targetDateStr){
  const m = monthsBetween(targetDateStr);
  if(m<=12) return "Short-term";
  if(m<=36) return "Medium-term";
  return "Long-term";
}
function renderGoals(){
  const row = document.getElementById("goalsRow");
  const active = goals.filter(g=>g.status!=="achieved");
  let html = active.map(g=>{
    const saved = goalSaved(g);
    const remaining = Math.max(0, (Number(g.targetAmount)||0) - saved);
    const monthsLeft = monthsBetween(g.targetDate);
    const reqMonthly = remaining>0 ? remaining/monthsLeft : 0;
    const pct = g.targetAmount>0 ? Math.min(100, (saved/g.targetAmount)*100) : 0;

    const monthsElapsed = g.createdDate ? Math.max(0,(now.getFullYear()-new Date(g.createdDate).getFullYear())*12+(now.getMonth()-new Date(g.createdDate).getMonth())) : 0;
    const contributedSoFar = saved - (Number(g.startingSaved)||0);
    let paceHtml;
    if(monthsElapsed < 1){
      paceHtml = '<span class="goal-pace pace-new">New goal</span>';
    } else {
      const actualPace = contributedSoFar / monthsElapsed;
      if(actualPace >= reqMonthly || saved >= g.targetAmount){
        paceHtml = '<span class="goal-pace pace-ontrack">On track</span>';
      } else {
        const shortfall = reqMonthly - actualPace;
        paceHtml = '<span class="goal-pace pace-behind">Behind \u2014 \u20B9'+fmt(shortfall)+'/mo more</span>';
      }
    }
    const achieved = saved >= g.targetAmount && g.targetAmount>0;

    return '<div class="goal-card">'+
      '<div class="goal-top"><span class="goal-name">'+escapeHtml(g.name)+'</span><span class="goal-badge">'+classifyGoal(g.targetDate)+'</span></div>'+
      '<div class="goal-amounts"><b class="mono">\u20B9'+fmt(saved)+'</b> of <b class="mono">\u20B9'+fmt(g.targetAmount)+'</b></div>'+
      '<div class="goal-bar-bg"><div class="goal-bar-fill" style="width:'+pct+'%;'+(achieved?'background:var(--green)':'')+'"></div></div>'+
      (achieved ? '<div class="goal-req">Target reached \ud83c\udf89</div>' :
        '<div class="goal-req">'+monthsLeft+' months left \u00b7 needs \u20B9'+fmt(reqMonthly)+'/mo</div>')+
      paceHtml+
      '<div class="goal-actions">'+
        (achieved ? '<button onclick="markGoalAchieved(\''+g.id+'\')">Mark achieved</button>':'')+
        '<button onclick="deleteGoal(\''+g.id+'\')">Delete</button>'+
      '</div>'+
      '</div>';
  }).join("");
  html += '<div class="addgoal-card" onclick="openGoalModal()"><div class="addgoal-plus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16283D" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>Add a goal</div>';
  row.innerHTML = html;
}

function catListFor(type){
  return type==="income" ? INCOME_CATEGORIES : type==="investment" ? INVESTMENT_CATEGORIES : EXPENSE_CATEGORIES;
}
function entryFormHtml(){
  const isEdit = !!editingEntryId;

  return '<div class="modal-handle"></div>'+
    '<div class="form-heading">'+(isEdit?"Editing entry":"New entry")+'</div>'+
    '<div class="toggle-row">'+
      '<button class="toggle-btn'+(entryForm.type==="expense"?" active-expense":"")+'" onclick="setEntryType(\'expense\')">Expense</button>'+
      '<button class="toggle-btn'+(entryForm.type==="income"?" active-income":"")+'" onclick="setEntryType(\'income\')">Income</button>'+
      '<button class="toggle-btn'+(entryForm.type==="investment"?" active-investment":"")+'" onclick="setEntryType(\'investment\')">Investment</button>'+
    '</div>'+
    '<div class="form-grid">'+
      '<select id="eCategory">'+cats.map(c=>'<option value="'+c.id+'"'+(entryForm.category===c.id?' selected':'')+'>'+c.id+'</option>').join("")+'</select>'+
      '<input type="number" id="eAmount" placeholder="Amount (\u20B9)" value="'+escapeHtml(entryForm.amount)+'">'+
    '</div>'+
    '<div class="form-grid" style="grid-template-columns:1fr;">'+
      '<input type="text" id="eNote" placeholder="Note (optional)" value="'+escapeHtml(entryForm.note)+'">'+
    '</div>'+
    (entryForm.type==="investment" && activeGoals.length>0 ?
      '<select id="eGoal" style="margin-bottom:12px;"><option value="">Not linked to a goal</option>'+
        activeGoals.map(g=>'<option value="'+g.id+'"'+(entryForm.goalId===g.id?' selected':'')+'>'+escapeHtml(g.name)+'</option>').join("")+
      '</select>' : '')+
    (entryForm.type!=="income" ?
      '<div class="toggle-row">'+
        '<button class="toggle-btn'+(entryForm.status==="pending"?" active-pending":"")+'" onclick="setEntryStatus(\'pending\')">Pending</button>'+
        '<button class="toggle-btn'+(entryForm.status==="paid"?" active-paid":"")+'" onclick="setEntryStatus(\'paid\')">Paid</button>'+
      '</div>' : '')+
    '<div class="toggle-row">'+
      '<button class="cancelbtn" onclick="closeModal()">Cancel</button>'+
      '<button class="submitbtn" onclick="'+(isEdit?'saveEntryEdit()':'addEntry()')+'">'+(isEdit?"Save changes":"Add entry")+'</button>'+
    '</div>';
}
function wireEntryForm(){
  document.getElementById("eNote").oninput = e=>{ entryForm.note=e.target.value; };
  document.getElementById("eAmount").oninput = e=>{ entryForm.amount=e.target.value; };
  document.getElementById("eCategory").onchange = e=>{ entryForm.category=e.target.value; };
  const goalSel = document.getElementById("eGoal");
  if(goalSel) goalSel.onchange = e=>{ entryForm.goalId = e.target.value; };
}
window.setEntryType = (t)=>{
  entryForm.type = t;
  entryForm.category = catListFor(t)[0].id;
  entryForm.status = t==="income" ? "paid" : "pending";
  renderModal();
};
window.setEntryStatus = (s)=>{ entryForm.status = s; renderModal(); };
window.addEntry = async ()=>{
  const amt = parseFloat(entryForm.amount);
  if(!amt || amt<=0) return;
  await addDoc(collection(db,"users",currentUser.uid,"entries"), {
    year: selYear ?? now.getFullYear(),
    month: selMonth ?? now.getMonth(),
    type: entryForm.type,
    category: entryForm.category,
    note: (entryForm.note||"").trim(),
    amount: amt,
    status: entryForm.status,
    goalId: entryForm.type==="investment" ? (entryForm.goalId||null) : null,
  });
  closeModal();
};
window.saveEntryEdit = async ()=>{
  const amt = parseFloat(entryForm.amount);
  if(!amt || amt<=0) return;
  await updateDoc(doc(db,"users",currentUser.uid,"entries",editingEntryId), {
    type: entryForm.type,
    category: entryForm.category,
    note: (entryForm.note||"").trim(),
    amount: amt,
    status: entryForm.status,
    goalId: entryForm.type==="investment" ? (entryForm.goalId||null) : null,
  });
  closeModal();
};

function goalFormHtml(){
  const monthsLeft = monthsBetween(goalForm.targetDate);
  const remaining = Math.max(0, (parseFloat(goalForm.targetAmount)||0) - (parseFloat(goalForm.startingSaved)||0));
  const reqMonthly = goalForm.targetDate ? remaining/monthsLeft : null;
  return '<div class="modal-handle"></div>'+
    '<div class="form-heading">New goal</div>'+
    '<div class="form-grid" style="grid-template-columns:1fr;">'+
      '<input type="text" id="gName" placeholder="Goal name (e.g. New car)" value="'+escapeHtml(goalForm.name)+'">'+
    '</div>'+
    '<div class="form-grid">'+
      '<select id="gCategory">'+GOAL_CATEGORIES.map(c=>'<option'+(goalForm.category===c?' selected':'')+'>'+c+'</option>').join("")+'</select>'+
      '<input type="date" id="gTargetDate" value="'+goalForm.targetDate+'">'+
    '</div>'+
    '<div class="form-grid">'+
      '<input type="number" id="gTargetAmount" placeholder="Target amount (\u20B9)" value="'+escapeHtml(goalForm.targetAmount)+'">'+
      '<input type="number" id="gStartingSaved" placeholder="Already saved (\u20B9, optional)" value="'+escapeHtml(goalForm.startingSaved)+'">'+
    '</div>'+
    (reqMonthly!==null ? '<div class="live-req">\u2248 \u20B9'+fmt(reqMonthly)+'/month needed to hit this by '+goalForm.targetDate+'</div>' : '')+
    '<div class="toggle-row">'+
      '<button class="cancelbtn" onclick="closeModal()">Cancel</button>'+
      '<button class="submitbtn" onclick="saveGoal()">Create goal</button>'+
    '</div>';
}
function wireGoalForm(){
  const fields = {gName:"name", gTargetDate:"targetDate", gTargetAmount:"targetAmount", gStartingSaved:"startingSaved"};
  Object.keys(fields).forEach(id=>{
    const el = document.getElementById(id);
    el.oninput = (e)=>{
      goalForm[fields[id]] = e.target.value;
      const caretPos = e.target.selectionStart;
      renderModal();
      const refocused = document.getElementById(id);
      refocused.focus();
      if(refocused.setSelectionRange) refocused.setSelectionRange(caretPos, caretPos);
    };
  });
  document.getElementById("gCategory").onchange = e=>{ goalForm.category = e.target.value; };
}
window.saveGoal = async ()=>{
  const amt = parseFloat(goalForm.targetAmount);
  if(!goalForm.name.trim() || !amt || amt<=0 || !goalForm.targetDate) return;
  await addDoc(collection(db,"users",currentUser.uid,"goals"), {
    name: goalForm.name.trim(),
    category: goalForm.category,
    targetAmount: amt,
    targetDate: goalForm.targetDate,
    startingSaved: parseFloat(goalForm.startingSaved)||0,
    createdDate: new Date().toISOString().slice(0,10),
    status: "active",
  });
  closeModal();
};

// ================= ENTRIES LIST =================
function entryCard(t){
  const meta = (CAT_MAPS[t.type] && CAT_MAPS[t.type][t.category]) || {color:"#999",code:"?"};
  const rowClass = "entry-row"+(t.type==="income"?" income":t.type==="investment"?" investment":"");
  const sign = t.type==="income" ? "+" : t.type==="investment" ? "\u2192" : "\u2212";
  const linkedGoal = t.goalId ? goals.find(g=>g.id===t.goalId) : null;
  return '<div class="'+rowClass+'">'+
    '<div class="entry-main">'+
      '<div class="entry-icon" style="background:'+meta.color+'22;color:'+meta.color+'">'+meta.code+'</div>'+
      '<div class="entry-body"><div class="entry-title">'+escapeHtml(t.category)+(linkedGoal?'<span class="goal-chip">'+escapeHtml(linkedGoal.name)+'</span>':'')+'</div>'+
      (t.note?'<div class="entry-note">'+escapeHtml(t.note)+'</div>':'')+'</div>'+
    '</div>'+
    '<div class="entry-side">'+
      '<div class="entry-amt mono">'+sign+'\u20B9'+fmt(t.amount)+'</div>'+
      (t.type!=="income" ? '<button class="status-btn '+t.status+'" onclick="toggleStatus(\''+t.id+'\')">'+(t.status==="paid"?"Paid":"Pending")+'</button>' : '')+
      '<button class="iconbtn" onclick="startEditEntry(\''+t.id+'\')" title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>'+
      '<button class="iconbtn" onclick="deleteEntry(\''+t.id+'\')" title="Delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>'+
    '</div>'+
    '</div>';
}
function renderEntries(filtered){
  const list = document.getElementById("entriesList");
  if(filtered.length===0){ list.innerHTML = '<div class="empty">Nothing logged for '+periodLabel().toLowerCase()+' yet.</div>'; return; }
  const income = filtered.filter(t=>t.type==="income").sort((a,b)=>b.amount-a.amount);
  const investment = filtered.filter(t=>t.type==="investment").sort((a,b)=>b.amount-a.amount);
  const expense = filtered.filter(t=>t.type==="expense").sort((a,b)=>b.amount-a.amount);
  let html = "";
  if(income.length){ html += '<div class="group-label">Income</div>' + income.map(entryCard).join(""); }
  if(investment.length){ html += '<div class="group-label">Investments</div>' + investment.map(entryCard).join(""); }
  if(expense.length){ html += '<div class="group-label">Expenses</div>' + expense.map(entryCard).join(""); }
  list.innerHTML = html;
}
window.toggleStatus = async (id)=>{
  const t = entries.find(x=>x.id===id);
  if(!t) return;
  await updateDoc(doc(db,"users",currentUser.uid,"entries",id), {status: t.status==="paid"?"pending":"paid"});
};
window.deleteEntry = async (id)=>{
  if(!confirm("Delete this entry?")) return;
  await deleteDoc(doc(db,"users",currentUser.uid,"entries",id));
};

// ================= MASTER RENDER =================
function renderAll(){
  renderPicker();
  document.getElementById("periodLabel").textContent = periodLabel();
  const filtered = getFiltered();
  renderKpis(computeKpi(filtered));
  renderBreakdown(filtered, "expense", "expenseBreakdown");
  renderBreakdown(filtered, "investment", "investmentBreakdown");
  renderGoals();
  renderEntries(filtered);
}
renderAll();
</script>
</body>
